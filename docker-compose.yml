services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lazy_clipper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazy_clipper"]
      interval: 3m
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/lazy_clipper
      STORAGE_DIR: /app/storage
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4000}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      YTDLP_COOKIE_FILE: ${YTDLP_COOKIE_FILE:-/app/cookies.txt}
      YTDLP_JS_RUNTIME: ${YTDLP_JS_RUNTIME:-node}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      TRANSCRIPT_CHUNK_SECONDS: ${TRANSCRIPT_CHUNK_SECONDS:-300}
      TRANSCRIPT_OVERLAP_SECONDS: ${TRANSCRIPT_OVERLAP_SECONDS:-45}
      MAX_MOMENTS: ${MAX_MOMENTS:-10}
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 3m
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 6
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      # Optional authentication cookies for YouTube. The application ignores
      # this path when it is absent or is not a regular file.
      - ./cookies.txt:/app/cookies.txt:ro
      - whisper_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  whisper_cache:
