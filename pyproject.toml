[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyclipper"
version = "0.1.0"
description = "A minimal YouTube transcript and clip-moment pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "yt-dlp==2026.8.19",
  "yt-dlp-ejs==0.8.0",
  "openai>=1.54,<2",
]

[project.optional-dependencies]
transcription = [
  "whisper-timestamped>=1.15,<2",
]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
