server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    location /api/ {
        # Resolve Docker's service name again if the API container is replaced.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream source/clip files without buffering them to the proxy's disk.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
